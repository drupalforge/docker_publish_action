---
name: 'Drupal Forge publish image manifest'
description: 'Pushes an image manifest to Docker Hub for a Drupal Forge template.'
author: 'Drupal Forge'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  dockerhub_username:
    description: 'Docker Hub username'
    required: false
  dockerhub_token:
    description: 'Docker Hub token'
    required: false
  image_repo:
    description: 'Docker Hub image repository'
    required: false
  ghcr_visibility:
    description: 'GHCR package visibility: public or private. Defaults to public only when the image and public source repositories match.'
    required: false
  image_tag:
    description: 'Primary image tag. Defaults to the branch or tag name, in which case latest is also published on the default branch.'
    required: false
  additional_tags:
    description: 'Additional image tags to publish (space or newline separated).'
    required: false
  manifest_images:
    description: 'JSON map of platforms to images for manifest creation.'
    required: false
runs:
  using: "composite"
  steps:
    - name: Check if manifest_images is set and complete
      id: check_images
      env:
        IMAGES_JSON: ${{ inputs.manifest_images }}
      run: |
        echo "$IMAGES_JSON" | jq -r '.[]' | while IFS= read -r IMAGE; do
          if [ -z "$IMAGE" ]; then
            echo "Missing or empty image, skipping manifest build."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
        done
      shell: bash

    - name: Resolve registry
      id: registry
      run: |
        if [ -n "${{ inputs.dockerhub_username }}" ] && [ -n "${{ inputs.dockerhub_token }}" ]; then
          echo "use_dockerhub=true" >> $GITHUB_OUTPUT
        else
          echo "use_dockerhub=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Set IMAGE_REPO variable
      if: steps.check_images.outputs.skip != 'true'
      run: |
        if [ "${{ steps.registry.outputs.use_dockerhub }}" = "true" ]; then
          echo "IMAGE_REPO=${{ inputs.image_repo || github.repository }}" >> $GITHUB_ENV
        else
          RAW="${{ inputs.image_repo || github.repository }}"
          echo "IMAGE_REPO=ghcr.io/$(echo "$RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Set tags to be pushed
      if: steps.check_images.outputs.skip != 'true'
      env:
        IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
        ADDITIONAL_TAGS: ${{ inputs.additional_tags }}
        PUBLISH_LATEST: ${{ !inputs.image_tag && github.ref_name == github.event.repository.default_branch }}
      run: |
        TAGS="$IMAGE_TAG $ADDITIONAL_TAGS"
        if [ "$PUBLISH_LATEST" = true ]; then
          TAGS="$TAGS latest"
        fi
        echo "TAGS=$(tr -s '[:space:]' ' ' <<< "$TAGS")" >> "$GITHUB_ENV"
      shell: bash

    - name: Resolve GHCR visibility
      if: steps.check_images.outputs.skip != 'true' && steps.registry.outputs.use_dockerhub != 'true'
      env:
        VISIBILITY: ${{ inputs.ghcr_visibility }}
        CODE_REPO: ${{ github.repository }}
        REPO_PRIVATE: ${{ github.event.repository.private }}
        STRATEGY_PATH: ${{ github.action_path }}/../scripts
      run: |
        VISIBILITY=$(jq -nr -L "$STRATEGY_PATH" \
          --arg visibility "$VISIBILITY" --arg image_repo "${IMAGE_REPO#ghcr.io/}" \
          --arg code_repo "$CODE_REPO" --arg repo_private "$REPO_PRIVATE" \
          'include "ghcr-visibility"; ghcr_visibility($visibility; $image_repo; $code_repo; $repo_private)')
        echo "GHCR_VISIBILITY=$VISIBILITY" >> "$GITHUB_ENV"
      shell: bash

    - name: Log in to Docker Hub
      if: steps.check_images.outputs.skip != 'true' && steps.registry.outputs.use_dockerhub == 'true'
      uses: docker/login-action@v4.1.0
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Log in to GitHub Container Registry
      if: steps.check_images.outputs.skip != 'true' && steps.registry.outputs.use_dockerhub != 'true'
      uses: docker/login-action@v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Create and push manifest to Docker Hub
      if: steps.check_images.outputs.skip != 'true'
      env:
        DOCKER_CLI_EXPERIMENTAL: enabled
        IMAGES_JSON: ${{ inputs.manifest_images }}
      run: |
        for TAG in $TAGS; do
          echo "Creating manifest for tag: $TAG"
          CREATE_CMD="docker manifest create $IMAGE_REPO:$TAG"
          for IMAGE in $(echo "$IMAGES_JSON" | jq -r '.[]'); do
            CREATE_CMD="$CREATE_CMD --amend $IMAGE"
          done
          eval $CREATE_CMD
          docker manifest push $IMAGE_REPO:$TAG
        done
      shell: bash

    - name: Set GHCR package visibility
      if: steps.check_images.outputs.skip != 'true' && steps.registry.outputs.use_dockerhub != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        REPO="${IMAGE_REPO#ghcr.io/}"
        OWNER="${REPO%%/*}"
        PACKAGE_NAME=$(jq -rn --arg name "${REPO#*/}" '$name | @uri')
        OWNER_TYPE=$(gh api "/users/$OWNER" --jq '.type')
        if [ "$OWNER_TYPE" = "Organization" ]; then
          ENDPOINT="/orgs/$OWNER/packages/container/$PACKAGE_NAME"
        else
          ENDPOINT="/user/packages/container/$PACKAGE_NAME"
        fi
        if ! gh api -X PATCH "$ENDPOINT" -f "visibility=$GHCR_VISIBILITY"; then
          echo "::warning::Could not set GHCR visibility to $GHCR_VISIBILITY. Check the package settings."
        fi
      shell: bash
