name: 'Drupal Forge build platform image'
description: 'Builds and pushes a platform image tagged by branch name to a container registry for a Drupal Forge template.'
author: 'Drupal Forge'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  dockerhub_username:
    description: 'Docker Hub username'
    required: false
  dockerhub_token:
    description: 'Docker Hub token'
    required: false
  dp_ai_virtual_key:
    description: 'DevPanel AI Virtual Key'
    required: false
  composer_auth:
    description: 'Composer auth JSON for private package access during init steps'
    required: false
  image_repo:
    description: 'Docker Hub image repository'
    required: false
  files_to_hash:
    description: 'List of files to check for changes (space or newline separated). Relative paths are assumed to be in app root. Defaults to composer.lock if not provided.'
    required: false
  cached_hash:
    description: 'Previously cached files hash for comparison.'
    required: false
  build_platform:
    description: 'Target platform for the build. Defaults to linux/amd64.'
    required: false
  base_image:
    description: 'Base Docker image to build from. If omitted, no BASE_IMAGE build arg is passed and the Dockerfile default is used.'
    required: false
  prepend_dockerfile_path:
    description: 'Path to a Dockerfile (relative to app root) whose instructions are prepended before the base Dockerfile. Multi-stage builds with additional FROM stages are supported here. Prepend files must declare their own ARG statements for any variables they use (for example, ARG BASE_IMAGE before FROM $BASE_IMAGE). The file must not include a "# syntax=" directive. Defaults to .devpanel/prepend.Dockerfile if it exists.'
    required: false
  dockerfile_path:
    description: 'Path to a Dockerfile (relative to app root) whose instructions are appended to the base Dockerfile. This file can COPY --from stages defined in prepend_dockerfile_path. The file must not include a "# syntax=" directive. Defaults to .devpanel/Dockerfile if it exists.'
    required: false
  cancel_run_on_skip:
    description: 'Cancel the workflow run when the hash is unchanged (skip=true) unless set to false. Requires actions: write permission on GITHUB_TOKEN.'
    required: false
runs:
  using: "composite"
  steps:
    - name: Check out code
      uses: actions/checkout@v6.0.2
      with:
        path: app

    - name: Resolve registry
      id: registry
      run: |
        if [ -n "${{ inputs.dockerhub_username }}" ] && [ -n "${{ inputs.dockerhub_token }}" ]; then
          echo "use_dockerhub=true" >> $GITHUB_OUTPUT
        else
          echo "use_dockerhub=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Log in to Docker Hub
      if: steps.registry.outputs.use_dockerhub == 'true'
      uses: docker/login-action@v4.1.0
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Log in to GitHub Container Registry
      if: steps.registry.outputs.use_dockerhub != 'true'
      uses: docker/login-action@v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.0.0

    - name: Try Docker Buildx Cloud builder
      if: inputs.build_platform && inputs.build_platform != 'linux/amd64' && steps.registry.outputs.use_dockerhub == 'true'
      id: buildx_cloud
      continue-on-error: true
      uses: docker/setup-buildx-action@v4.0.0
      with:
        driver: cloud
        endpoint: "${{ inputs.dockerhub_username }}/github"

    - name: Set IMAGE_REPO variable
      run: |
        if [ "${{ steps.registry.outputs.use_dockerhub }}" = "true" ]; then
          echo "IMAGE_REPO=${{ inputs.image_repo || github.repository }}" >> $GITHUB_ENV
        else
          RAW="${{ inputs.image_repo || github.repository }}"
          echo "IMAGE_REPO=ghcr.io/$(echo "$RAW" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Determine Dockerfile to use
      id: dockerfile
      run: |
        set -e
        BASE_DOCKERFILE="${{ github.action_path }}/Dockerfile"
        PREPEND_PATH="${{ inputs.prepend_dockerfile_path }}"
        CUSTOM_PATH="${{ inputs.dockerfile_path }}"
        COMBINED="/tmp/Dockerfile.combined"
        APP_ROOT="$(realpath app)"

        resolve_path() {
          local candidate_path="$1"
          local error_label="$2"
          local resolved_path

          resolved_path="$(realpath "app/$candidate_path" 2>/dev/null || true)"
          if [ -z "$resolved_path" ]; then
            echo "::error::$error_label '$candidate_path' could not be resolved under app root"
            exit 1
          fi

          case "${resolved_path}/" in
            "${APP_ROOT}/"*) ;;
            *)
              echo "::error::$error_label '$candidate_path' resolves outside the app root"
              exit 1
              ;;
          esac

          if [ ! -f "$resolved_path" ] || [ ! -r "$resolved_path" ]; then
            echo "::error::$error_label '$candidate_path' is not a readable file"
            exit 1
          fi

          printf '%s' "$resolved_path"
        }

        PREPEND_RESOLVED=""
        if [ -n "$PREPEND_PATH" ]; then
          PREPEND_RESOLVED="$(resolve_path "$PREPEND_PATH" "prepend_dockerfile_path")"
        elif [ -r "app/.devpanel/prepend.Dockerfile" ]; then
          PREPEND_RESOLVED="app/.devpanel/prepend.Dockerfile"
        fi

        if [ -n "$PREPEND_RESOLVED" ] && grep -qE '^# syntax=' "$PREPEND_RESOLVED"; then
          echo "::error::prepend_dockerfile_path must not contain a '# syntax=' directive"
          exit 1
        fi

        APPEND_RESOLVED=""
        if [ -n "$CUSTOM_PATH" ]; then
          APPEND_RESOLVED="$(resolve_path "$CUSTOM_PATH" "dockerfile_path")"
        elif [ -r "app/.devpanel/Dockerfile" ]; then
          APPEND_RESOLVED="app/.devpanel/Dockerfile"
        fi

        if [ -n "$APPEND_RESOLVED" ] && grep -qE '^# syntax=' "$APPEND_RESOLVED"; then
          echo "::error::dockerfile_path must not contain a '# syntax=' directive"
          exit 1
        fi

        : > "$COMBINED"
        if [ -n "$PREPEND_RESOLVED" ]; then
          cat "$PREPEND_RESOLVED" >> "$COMBINED"
        fi
        cat "$BASE_DOCKERFILE" >> "$COMBINED"
        if [ -n "$APPEND_RESOLVED" ]; then
          cat "$APPEND_RESOLVED" >> "$COMBINED"
        fi
        echo "path=$COMBINED" >> $GITHUB_OUTPUT
      shell: bash

    - name: Resolve Docker build args
      id: build_args
      run: |
        {
          echo 'value<<EOF'
          echo 'APP_ROOT=/var/www/html'
          echo 'APACHE_RUN_USER=www'
          echo 'APACHE_RUN_GROUP=www'
          if [ -n "${{ inputs.base_image }}" ]; then
            echo "BASE_IMAGE=${{ inputs.base_image }}"
          fi
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build image with cloud builder (no push, load to local Docker)
      if: steps.buildx_cloud.outcome == 'success'
      id: build_image_cloud
      continue-on-error: true
      uses: docker/build-push-action@v7.1.0
      with:
        context: ./app
        file: ${{ steps.dockerfile.outputs.path }}
        platforms: ${{ inputs.build_platform }}
        build-args: ${{ steps.build_args.outputs.value }}
        push: false
        load: true

    - name: Set up docker-container builder after cloud build failure
      if: steps.build_image_cloud.outcome != 'success'
      uses: docker/setup-buildx-action@v4.0.0

    - name: Build image with docker-container builder (no push, load to local Docker)
      if: steps.build_image_cloud.outcome != 'success'
      id: build_image_local
      uses: docker/build-push-action@v7.1.0
      with:
        context: ./app
        file: ${{ steps.dockerfile.outputs.path }}
        platforms: ${{ inputs.build_platform || 'linux/amd64' }}
        build-args: ${{ steps.build_args.outputs.value }}
        push: false
        load: true

    - name: Select built image ID
      id: built_image
      run: |
        IMAGE_ID="${{ steps.build_image_cloud.outputs.imageid || steps.build_image_local.outputs.imageid }}"
        if [ -z "$IMAGE_ID" ]; then
          echo "::error::No image ID was produced by either cloud or local build step."
          exit 1
        fi
        echo "imageid=$IMAGE_ID" >> $GITHUB_OUTPUT
      shell: bash

    - name: Run init.sh in container with MySQL
      id: post_build_init
      env:
        DP_AI_VIRTUAL_KEY: ${{ inputs.dp_ai_virtual_key }}
        COMPOSER_AUTH: ${{ inputs.composer_auth }}
      run: |
        TRANSIENT_ENV_FILE="$(mktemp)"
        cat <<'EOF' > "$TRANSIENT_ENV_FILE"
        DB_HOST=mysql
        DB_PORT=3306
        DB_ROOT_PASSWORD=root
        DB_NAME=drupaldb
        DB_USER=user
        DB_PASSWORD=password
        DB_DRIVER=mysql
        EOF

        WEBSERVER=$(docker run -d --network ${NETWORK:-bridge} \
          -e DP_APP_ID=$IMAGE_REPO \
          -e APP_ROOT="/var/www/html" \
          -e WEB_ROOT="/var/www/html/web" \
          -e APACHE_RUN_USER="www" \
          -e APACHE_RUN_GROUP="www" \
          -e CODES_ENABLE="no" \
          ${{ steps.built_image.outputs.imageid }})
        echo "TRANSIENT_ENV_FILE=$TRANSIENT_ENV_FILE" >> $GITHUB_ENV
        echo "WEBSERVER=$WEBSERVER" >> $GITHUB_ENV
        docker exec $WEBSERVER bash -lc '
          echo "=== PHP INI ==="
          php --ini
          echo "=== PHP ERROR SETTINGS ==="
          php -i | grep -E "^(display_errors|display_startup_errors|error_reporting|log_errors|html_errors|xdebug\\.mode) =>"
          echo "=== ENV ==="
          env | grep -E "^(PHP_|XDEBUG_|SYMFONY_|DRUPAL_)"
        '
        echo "INSTALL DRUPAL"
        docker exec --env-file "$TRANSIENT_ENV_FILE" \
          -e DP_AI_VIRTUAL_KEY \
          -e COMPOSER_AUTH \
          "$WEBSERVER" sh -c '$APP_ROOT/.devpanel/init.sh'
      shell: bash

    - name: Hash current files
      id: hash_files
      env:
        FILES_TO_HASH: ${{ inputs.files_to_hash || 'composer.lock' }}
      run: |
        echo "HASH FILES"
        APP_ROOT=$(docker exec $WEBSERVER bash -c 'echo $APP_ROOT')
        HASH=""
        if [ -n $FILES_TO_HASH ]; then
          EXISTING_FILES=""
          # Use eval and set to handle quoted filenames with spaces
          eval set -- $FILES_TO_HASH
          for f; do
            if [ ${f:0:1} != / ]; then
              # Check relative to $APP_ROOT
              f=$APP_ROOT/$f
            fi
            echo "Hashing $f to check for changes."
            if docker exec $WEBSERVER bash -c "test -f '$f'"; then
              if [ -n $EXISTING_FILES ]; then
                f=$'\n'$f
              fi
              EXISTING_FILES=$EXISTING_FILES$f
            fi
          done
          if [ -n $EXISTING_FILES ]; then
            EXISTING_FILES=$(echo $EXISTING_FILES | sort)
            for f in $EXISTING_FILES; do
              FILE_HASH=$(docker exec $WEBSERVER bash -c "sha256sum \"$f\" | awk '{print \$1}'")
              if [ -z $HASH ]; then
                HASH=$FILE_HASH
              else
                HASH=$(printf "%s%s" $HASH $FILE_HASH | sha256sum | awk '{print $1}')
              fi
            done
          fi
        fi
        echo "hash=$HASH" >> $GITHUB_OUTPUT
      shell: bash

    - name: Compare current and previouse file hashes
      if: github.event_name != 'push' && steps.hash_files.outputs.hash != ''
      id: compare_hash
      env:
        CACHED_HASH: ${{ inputs.cached_hash }}
        HASH: ${{ steps.hash_files.outputs.hash }}
      run: |
        echo "CHECK FOR CHANGES"
        if [ -n "$CACHED_HASH" ] && [ "$CACHED_HASH" == "$HASH" ]; then
          echo "Hash unchanged, skipping rest of the action."
          echo "skip=true" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Cancel workflow run when hash is unchanged
      if: steps.compare_hash.outputs.skip == 'true' && inputs.cancel_run_on_skip != 'false'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! command -v gh >/dev/null 2>&1; then
          echo "::warning::gh CLI is not available. Skipping workflow cancellation."
          exit 0
        fi
        echo "Hash unchanged. Cancelling workflow run ${{ github.run_id }}."
        if ! gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"; then
          echo "::warning::Could not cancel workflow run. Ensure the caller grants 'actions: write' permission to GITHUB_TOKEN."
        fi
      shell: bash

    - name: Save database and files dumps
      if: steps.compare_hash.outputs.skip != 'true'
      run: |
        echo "DUMPS DATABASE + STATIC FILE"
        docker exec --env-file "$TRANSIENT_ENV_FILE" "$WEBSERVER" bash -c '$APP_ROOT/.devpanel/create_quickstart.sh'
        docker exec "$WEBSERVER" bash -c 'rm $APP_ROOT/.devpanel/dumps/files.tgz'
      shell: bash

    - name: Commit and push the container state
      if: steps.compare_hash.outputs.skip != 'true'
      id: push_image
      run: |
        docker commit $WEBSERVER $IMAGE_REPO:${{ github.ref_name }}
        docker push $IMAGE_REPO:${{ github.ref_name }}
        IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_REPO:${{ github.ref_name }})
        echo "image=$IMAGE" >> $GITHUB_OUTPUT
      shell: bash

    - name: Set GHCR package visibility
      if: steps.compare_hash.outputs.skip != 'true' && steps.registry.outputs.use_dockerhub != 'true' && github.event.repository.private == false
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PACKAGE_NAME=$(echo "$IMAGE_REPO" | sed 's|ghcr.io/[^/]*/||')
        OWNER="${{ github.repository_owner }}"
        OWNER_TYPE=$(gh api "/users/$OWNER" --jq '.type')
        if [ "$OWNER_TYPE" = "Organization" ]; then
          gh api -X PATCH "/orgs/$OWNER/packages/container/$PACKAGE_NAME" -f visibility=public || true
        else
          gh api -X PATCH "/user/packages/container/$PACKAGE_NAME" -f visibility=public || true
        fi
      shell: bash
outputs:
  hash:
    description: 'Files hash'
    value: ${{ steps.hash_files.outputs.hash }}
  skip:
    description: 'Skip manifest generation'
    value: ${{ steps.compare_hash.outputs.skip }}
  image:
    description: 'Image pushed for this platform'
    value: ${{ steps.push_image.outputs.image }}
